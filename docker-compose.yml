services:
  strata-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - STRATA_WORKSPACE_ROOT=/app/workspaces
      - STRATA_DB_PATH=/app/.strata/strata.db
      - STRATA_LLM_PROVIDER=${STRATA_LLM_PROVIDER:-manual}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENAI_TEMPERATURE=${OPENAI_TEMPERATURE:-0.2}
    volumes:
      - ./workspaces:/app/workspaces
      - ./.strata:/app/.strata
    ports:
      - "8787:8787"

  strata-ui:
    build:
      context: ./strataforge/ui
      dockerfile: Dockerfile
      args:
        VITE_STRATA_API_BASE: /strataforge
    ports:
      - "8788:80"
    depends_on:
      - strata-api
